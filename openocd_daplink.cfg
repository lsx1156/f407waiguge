# DAPLink interface configuration
adapter driver cmsis-dap
adapter speed 1000

# 强制指定DAPLink的VID和PID（WCH-Link）
cmsis-dap vid_pid 0x1a86 0x8012

# Transport selection
transport select swd

# 不检查CPUID，强制连接
set CPUTAPID 0

# Target configuration
source [find target/stm32f4x.cfg]

# Reset configuration - 尝试多种方式
reset_config none separate
#reset_config srst_only srst_nogate connect_assert_srst
