# ST-Link interface configuration
adapter driver hla
hla layout stlink
hla device_desc "ST-LINK"
hla vid_pid 0x0483 0x3748 0x0483 0x374b 0x0483 0x374d 0x0483 0x3752 0x0483 0x3753

adapter speed 1000

# Transport selection
transport select swd

# Target configuration - 不强制检查CPUID
set CPUTAPID 0
source [find target/stm32f4x.cfg]

# Reset configuration - 使用assert srst连接
reset_config srst_only srst_nogate connect_assert_srst
